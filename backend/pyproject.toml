[project]
name = "venus-lens"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pillow>=10",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["pytest>=8", "websockets>=12"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
